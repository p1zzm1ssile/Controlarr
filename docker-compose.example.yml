services:
  controlarr:
    build: .
    container_name: controlarr
    restart: unless-stopped
    environment:
      - TZ=Europe/London            # times below are in this timezone
      # - CONTROLARR_DRY_RUN=true   # log what would happen without doing it
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config            # optional schedules.yml lives here

  # Example: stopped at 02:00 and started again at 07:00, every day.
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    labels:
      - controlarr.stop=02:00
      - controlarr.start=07:00
      - controlarr.order=20         # starts after anything with a lower number

  # Example: only on weekdays.
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    labels:
      - controlarr.stop=23:00
      - controlarr.start=06:30
      - controlarr.days=mon-fri
      - controlarr.order=20
      - controlarr.delay=45         # wait 45s after this before the next start
